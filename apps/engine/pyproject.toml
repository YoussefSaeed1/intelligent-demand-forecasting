[project]
name = "idf-engine-service"
version = "1.0.0"
description = "Private FastAPI simulation service for the Phase 7 web application"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Direct dependencies. starlette is pinned explicitly: >= 1.3.1 fixes CVE-2026-54283/-48818/-48710/-48817/-54282.
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "pydantic==2.12.5",
    "psycopg[binary]==3.2.13",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyyaml==6.0.3",
    "idf-inventory-core==1.0.0",
    # Complete transitive runtime closure, pinned for a reproducible install with uv (Vercel) or pip (local).
    # Resolved in a clean Python 3.14 venv on 2026-11-12 (pip check clean; OSV: no known vulnerabilities).
    "annotated-doc==0.0.6",
    "annotated-types==0.8.0",
    "anyio==4.16.0",
    "idna==3.20",
    "opentelemetry-api==1.45.2",
    "psycopg-binary==3.2.13",
    "pydantic-core==2.41.5",
    "python-dateutil==4.0.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.5",
    "tzdata==2026.6",
]

# The byte-identical Phase 5 engine lives in packages/inventory_core (outside this service root).
# Vercel builds Python projects with uv, which resolves this relative path source. Requires the Vercel
# project setting that includes files outside the root directory (to verify in Phase 7D).
[tool.uv.sources]
idf-inventory-core = { path = "../../packages/inventory_core" }

[project.optional-dependencies]
test = ["pytest>=8", "httpx==0.28.1", "pyarrow==26.0.1", "uvicorn==0.38.0"]

[tool.vercel]
entrypoint = "main:app"
