[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-demand"
version = "0.1.0"
description = "Reproducible demand forecasting and inventory planning research"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4",
  "statsmodels>=0.14", "matplotlib>=3.8", "seaborn>=0.13", "pyarrow>=15",
  "pyyaml>=6", "python-dotenv>=1", "kaggle>=2.2.5,<3", "psutil>=7",
]

[project.optional-dependencies]
dev = ["jupyterlab>=4", "pytest>=8", "ruff>=0.9"]
boosting = ["lightgbm>=4"]
tuning = ["optuna>=4"]
explain = ["shap>=0.46"]
tracking = ["mlflow>=2.15"]

[project.scripts]
demand-check = "intelligent_demand.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
